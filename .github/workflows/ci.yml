# Build and test git2 (Roadmap A2). Job names are required status checks on
# protected branches (Roadmap A1: ci, web, migrations-check, changelog), so
# keep them stable.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev/main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # A throwaway database for the *_integration_test.go files; never Supabase.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::run gofmt -w on: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The same runner developers use (make migrate), pointed at the
      # throwaway database.
      - name: Apply migrations to the test database
        env:
          POSTGRES_DSN: ${{ env.TEST_POSTGRES_DSN }}
        run: bash helpers/dev/migrate.sh

      # Redis-backed code is tested against miniredis; Postgres code against
      # the service above.
      - name: go test
        run: go test -race -count=1 ./...

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
