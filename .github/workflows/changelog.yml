# Every PR adds its lines to CHANGELOG.md (Roadmap A10, CLAUDE.md). A CI-only
# or typo PR can opt out with the `no-changelog` label.
#
# Its own workflow, so adding or removing the label re-runs only this check,
# not the whole build.
name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skipped by the no-changelog label
        if: contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: echo "no-changelog label set; not checking CHANGELOG.md"

      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        with:
          fetch-depth: 0

      - name: CHANGELOG.md is part of this PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error file=CHANGELOG.md::add this PR's lines under ## [Unreleased], or set the no-changelog label for CI-only or typo PRs"
            exit 1
          fi
