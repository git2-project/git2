services:

  # ── Go toolchain (VS Code attaches here) ──────────────────────────────
  # Postgres is not a service here: dev uses the shared Supabase project through
  # POSTGRES_DSN in ../.env.
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    volumes:
      - ..:/workspace:cached
      - go-modules:/go/pkg/mod
    command: sleep infinity
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    # .env is tuned for running on the host; inside the container Redis is
    # reached by its compose service name.
    environment:
      REDIS_ADDR: redis:6379

  # Not published on the host: everything that talks to it runs in `app`, and
  # an unpublished port cannot collide with another stack's Redis.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  go-modules:
