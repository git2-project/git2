openapi: 3.1.0
info:
  title: git2 auth-svc
  version: 0.1.0-draft
  description: |
    Sign-in for both planes: accounts, the access/refresh token pair, and the
    one-time setup of the first admin, and single sign-on through OIDC
    providers. Design notes: docs/design/identity-v0.md and
    docs/design/oidc-v0.md.

    Tokens are never in response bodies. Sign-in and refresh return them in
    the `X-Access-Token` / `X-Refresh-Token` headers; send the access token as
    `Authorization: Bearer <token>`.

    Request bodies are a single JSON object of at most 64 KiB; unknown fields
    are rejected with 400. Every error is `{"error": "..."}`. A database or
    Redis fault answers 5xx, never 401, so clients only drop their tokens on a
    real 401.

    Operations marked `x-status: draft` are not implemented yet, and their
    shape may still change. The others describe auth-svc as it runs today.
servers:
  - url: /api

tags:
  - name: auth
  - name: oidc
  - name: setup

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Email and username are trimmed and lowercased before validation.
        Rate limit: 10 requests per minute per client IP.

        Planned: answers 403 when self-registration is turned off in the
        instance settings (the default after setup).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          x-status: draft
          description: Self-registration is turned off. Planned; not returned yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`email already registered` or `username already taken`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Starts a new session. An unknown email and a wrong password give the
        same 401 in the same time. Rate limit: 20 per minute per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            X-Access-Token: { $ref: '#/components/headers/X-Access-Token' }
            X-Refresh-Token: { $ref: '#/components/headers/X-Refresh-Token' }
            X-Access-Expires-In: { $ref: '#/components/headers/X-Access-Expires-In' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid credentials`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`account is disabled`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Swap a refresh token for a new token pair
      description: |
        Each refresh token works once. Presenting one that was already
        rotated means it was copied: the whole session ends and the call
        answers 401. Rate limit: 60 per minute per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New pair issued in the same session.
          headers:
            X-Access-Token: { $ref: '#/components/headers/X-Access-Token' }
            X-Refresh-Token: { $ref: '#/components/headers/X-Refresh-Token' }
            X-Access-Expires-In: { $ref: '#/components/headers/X-Access-Expires-In' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          description: '`refresh_token is required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Token invalid, expired, reused, or the account is gone or disabled. Drop both tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the presented tokens
      description: |
        Revokes the bearer access token (if valid) and, when given, the
        refresh token's whole session. Always answers 200, so a client can
        sign out even with tokens that are already invalid. Rate limit: 30
        per minute per client IP.
      security:
        - {}
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: '`logged out`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The account behind the token no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Database fault. Keep the tokens and try again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/oidc/providers:
    get:
      tags: [oidc]
      operationId: listSignInProviders
      x-status: draft
      summary: The enabled OIDC providers, for the sign-in buttons
      security: []
      responses:
        '200':
          description: Enabled providers, by display name. Empty when SSO is not set up.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/SignInProvider' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /auth/oidc/{slug}/start:
    parameters:
      - $ref: '#/components/parameters/ProviderSlug'
    get:
      tags: [oidc]
      operationId: startOidcSignIn
      x-status: draft
      summary: Send the browser to the provider
      description: |
        A browser navigation, not an API call. Stores the state, nonce and
        PKCE verifier for 10 minutes and redirects to the provider's
        authorization endpoint. Rate limit: 30 per minute per client IP.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            Where to land after sign-in: a path on this instance that starts
            with a single `/`. A path under `/admin/` signs in to the Admin
            plane. Default `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: To the provider's authorization endpoint.
          headers:
            Location: { schema: { type: string, format: uri } }
        '303':
          description: |
            Back to the sign-in page with `?sso_error=provider_unavailable`
            when the provider cannot be reached.
          headers:
            Location: { schema: { type: string } }
        '400':
          description: '`return_to` is not a path on this instance.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No enabled provider with this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/oidc/{slug}/callback:
    parameters:
      - $ref: '#/components/parameters/ProviderSlug'
    get:
      tags: [oidc]
      operationId: oidcCallback
      x-status: draft
      summary: Where the provider sends the browser back
      description: |
        Register `GIT2_EXTERNAL_URL/api/auth/oidc/<slug>/callback` as the
        redirect URI at the provider. git2 checks the state, trades the code
        for an ID token (with the PKCE verifier), checks its signature,
        issuer, audience and nonce, and finds, links or creates the account
        (docs/design/oidc-v0.md). It never answers with tokens: it redirects
        to the plane's `/sign-in/callback?code=<handoff>&return_to=…`, or to
        its sign-in page with `?sso_error=<reason>`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - name: error
          in: query
          description: Set by the provider when the user cancelled or it refused.
          schema: { type: string }
      responses:
        '303':
          description: |
            To `/sign-in/callback` (or `/admin/sign-in/callback`) with a
            one-time `code`, or to `/sign-in` (or `/admin/sign-in`) with
            `sso_error`: `cancelled`, `provider_unavailable`,
            `account_disabled`, `email_in_use` or `failed`.
          headers:
            Location: { schema: { type: string } }

  /auth/oidc/exchange:
    post:
      tags: [oidc]
      operationId: exchangeOidcCode
      x-status: draft
      summary: Trade the one-time handoff code for a token pair
      description: |
        The callback page posts the `code` from its URL. A code works once
        and for 60 seconds. Rate limit: 30 per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Signed in; the same answer as `/auth/login`.
          headers:
            X-Access-Token: { $ref: '#/components/headers/X-Access-Token' }
            X-Refresh-Token: { $ref: '#/components/headers/X-Refresh-Token' }
            X-Access-Expires-In: { $ref: '#/components/headers/X-Access-Expires-In' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid or expired sign-in code`, or the account was disabled meanwhile.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /setup/status:
    get:
      tags: [setup]
      operationId: setupStatus
      summary: Whether the first admin still has to be created
      responses:
        '200':
          description: Setup state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /setup/admin:
    post:
      tags: [setup]
      operationId: setupAdmin
      summary: Create the first admin with the one-time setup token
      description: |
        The setup token is printed once in the server log at startup (or set
        with `GIT2_SETUP_TOKEN`, at least 32 characters) and works for one
        hour. Until then a restart or a second git2 process keeps it; after
        it, the next start prints a new one. It works once. Once an active
        admin exists this endpoint answers 409 to every request.
        Rate limit: 10 per minute per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupAdminRequest' }
      responses:
        '201':
          description: First admin created; sign in with /auth/login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`invalid setup token`, or `setup token expired; restart git2 to get a new one` (only for the right token). Not 401, which clients read as "signed out".'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`setup already completed`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  parameters:
    ProviderSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{2,38}$' }

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `X-Access-Token`.

  headers:
    X-Access-Token:
      description: 'Access JWT (HS256) for `Authorization: Bearer`.'
      schema: { type: string }
    X-Refresh-Token:
      description: Refresh JWT for /auth/refresh and /auth/logout.
      schema: { type: string }
    X-Access-Expires-In:
      description: Access token lifetime in seconds.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Body is not a single valid JSON object, has unknown fields, or fails validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, expired or revoked access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Per-IP rate limit hit.
      headers:
        Retry-After:
          description: Length of the rate-limit window in seconds (not the time left in it).
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or Redis fault. Retry; do not drop tokens.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Email:
      type: string
      format: email
      maxLength: 254
      description: Stored lowercase.

    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{2,38}$'
      description: Stored lowercase; used in repository URLs.

    EmailInput:
      type: string
      maxLength: 254
      description: Trimmed and lowercased by the server, then validated as `Email`.

    UsernameInput:
      type: string
      description: Trimmed and lowercased by the server, then validated as `Username`.

    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: At most 72 bytes (bcrypt limit).

    InstanceRole:
      type: string
      enum: [admin, user]

    User:
      type: object
      required: [id, email, username, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        username: { $ref: '#/components/schemas/Username' }
        role:
          $ref: '#/components/schemas/InstanceRole'
          description: The instance role. New accounts get `user`.
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email: { $ref: '#/components/schemas/EmailInput' }
        username: { $ref: '#/components/schemas/UsernameInput' }
        password: { $ref: '#/components/schemas/Password' }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [message, user]
      properties:
        message: { type: string }
        user: { $ref: '#/components/schemas/User' }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string }

    SignInProvider:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string }
        display_name: { type: string }

    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup: { type: boolean }

    SetupAdminRequest:
      type: object
      additionalProperties: false
      required: [setup_token, email, username, password]
      properties:
        setup_token: { type: string }
        email: { $ref: '#/components/schemas/EmailInput' }
        username: { $ref: '#/components/schemas/UsernameInput' }
        password: { $ref: '#/components/schemas/Password' }
