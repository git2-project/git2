[project]
name = "git2cli"
version = "0.1.0"
description = "git2's terminal client: the git2 command and its full-screen terminal UI"
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds on every runtime dependency (docs/design/tui-v0.md, section 9),
# so a major release cannot break an installed git2 without a PR here.
dependencies = [
    "filelock>=3.16,<5",
    "httpx>=0.28,<0.30",
    "textual>=8.2,<9",
    "typer>=0.29,<1",
]

[project.scripts]
git2 = "git2cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git2cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pilot tests are coroutines; the Textual testing guide runs them with
# pytest-asyncio in auto mode.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
