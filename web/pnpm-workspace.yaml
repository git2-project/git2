packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole workspace. React and the
# router must resolve to a single copy, or the UI kit and the apps end up with
# separate contexts.
catalog:
  react: 18.3.1
  react-dom: 18.3.1
  react-router-dom: 6.28.0
  "@types/react": 18.3.12
  "@types/react-dom": 18.3.1
  "@types/node": 22.10.1
  typescript: 5.6.3
  vite: 5.4.11
  "@vitejs/plugin-react": 4.3.4
  vitest: 2.1.8
  jsdom: 25.0.1
  "@testing-library/react": 16.1.0
  "@testing-library/user-event": 14.5.2
  "@testing-library/jest-dom": 6.6.3
